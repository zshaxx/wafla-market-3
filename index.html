<!DOCTYPE html>
<html lang="sw">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="light">
<title>Wafla Market - Mwanza</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
html{color-scheme:light !important;background:#fff !important}
body{background:#f5f5f5 !important;color:#000 !important}
*{color-scheme:light !important;box-sizing:border-box;margin:0;padding:0;font-family:Arial,sans-serif}
body{padding-bottom:80px}
header{background:#000 !important;color:#fff !important;padding:15px;text-align:center;position:sticky;top:0;z-index:10}
header h1{font-size:22px;color:#fff !important}
header p{font-size:12px;color:#ccc !important}
.topbar{display:flex;gap:8px;padding:10px;overflow-x:auto;background:#fff !important}
.topbar input{flex:1;padding:10px;border:1px solid #ddd;border-radius:100px;outline:none;min-width:140px;background:#fff !important;color:#000 !important}
.topbar select{padding:10px;border-radius:100px;border:1px solid #ddd;background:#fff !important;color:#000 !important}
.topbar button{padding:10px 14px;border:none;border-radius:100px;background:#000 !important;color:#fff !important;font-weight:700;white-space:nowrap}
#cats{display:flex;gap:8px;padding:10px;overflow-x:auto}
.cat{background:#fff !important;padding:8px 16px;border-radius:100px;white-space:nowrap;cursor:pointer;border:1px solid #eee;color:#000 !important}
.cat.active{background:#000 !important;color:#fff !important}
#locInfo{background:#fff3cd !important;padding:10px;margin:0 10px;border-radius:10px;font-size:13px;text-align:center;color:#000 !important}
#grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:10px}
.card{background:#fff !important;border-radius:15px;overflow:hidden;position:relative;color:#000 !important}
.card img{width:100%;height:180px;object-fit:cover;background:#eee}
.info{padding:10px}
.title{font-weight:800;font-size:14px;color:#000 !important}
.price{color:#e60000 !important;font-weight:900;margin:4px 0}
.meta{font-size:12px;color:#777 !important}
.loc-badge{position:absolute;top:8px;left:8px;background:#000 !important;color:#fff !important;font-size:11px;padding:4px 8px;border-radius:100px}
.loc-box{background:#f0f8ff !important;padding:8px;border-radius:10px;margin:8px 0;font-size:12px;color:#000 !important}
.btn{width:100%;background:#25D366 !important;color:#fff !important;border:none;padding:12px;border-radius:10px;font-weight:900;margin-top:8px;cursor:pointer}
.btn-map{display:block;text-align:center;background:#000 !important;color:#fff !important;padding:10px;border-radius:10px;text-decoration:none;font-size:13px;font-weight:700;margin-top:8px}
.btn-del{width:100%;background:#ff4444 !important;color:#fff !important;border:none;padding:10px;border-radius:10px;margin-top:8px;cursor:pointer}
#fabBtn{position:fixed;bottom:20px;right:20px;width:60px;height:60px;border-radius:50%;background:#000 !important;color:#fff !important;font-size:30px;border:none;display:none;align-items:center;justify-content:center;z-index:20;cursor:pointer}
.modal{position:fixed;inset:0;background:rgba(0,0,0,0.7);display:none;align-items:center;justify-content:center;z-index:50;padding:15px}
.modal.show{display:flex}
.modal-box{background:#fff !important;width:100%;max-width:420px;border-radius:20px;padding:20px;max-height:90vh;overflow-y:auto;color:#000 !important}
.modal-box h2{margin-bottom:12px;color:#000 !important}
.modal-box input,.modal-box select{width:100%;padding:12px;margin:6px 0;border:1px solid #ddd;border-radius:10px;background:#fff !important;color:#000 !important}
.modal-box button{width:100%;padding:13px;border:none;border-radius:10px;font-weight:900;margin-top:8px;cursor:pointer}
.btn-black{background:#000 !important;color:#fff !important}
.btn-grey{background:#eee !important;color:#000 !important}
#preview{width:100%;height:180px;object-fit:cover;border-radius:10px;display:none}
.upload-box{border:2px dashed #ccc;border-radius:10px;padding:15px;text-align:center;cursor:pointer;margin:6px 0;color:#000 !important}
.empty-box{grid-column:1/3;text-align:center;padding:30px;color:#888;background:#fff;border-radius:15px;word-wrap:break-word}
</style>
</head>
<body>
<header><h1>WAFLA MARKET</h1><p>Mwanza - Nyegezi, Rock City, Igoma, Nyakato na kwingineko</p></header>
<div class="topbar">
<input id="search" placeholder="Tafuta bidhaa..." oninput="render()">
<select id="locFilter" onchange="setLocationFilter(this.value)"><option value="Zote">Mwanza Yote</option><option>Nyegezi</option><option>Rock City</option><option>Igoma</option><option>Nyakato</option><option>Mkolani</option><option>Buhongwa</option><option>Nyamagana</option><option>Ilemela</option><option>Kiseke</option><option>Pasiansi</option><option>Kirumba</option><option>Isamilo</option></select>
<button onclick="useMyLocation()">Niko Wapi</button>
<button id="adminBtn" onclick="openPinModal()">ADMIN</button>
</div>
<div id="locInfo">Inaonyesha bidhaa za Mwanza Yote</div>
<div id="cats"></div>
<div id="grid"></div>
<button id="fabBtn" onclick="openModal()">+</button>
<div id="pinModal" class="modal"><div class="modal-box"><h2>Ingia Admin</h2><input id="adminPin" type="password" placeholder="Weka PIN"><button class="btn-black" onclick="checkPin()">INGIA</button><button class="btn-grey" onclick="closePinModal()">Funga</button></div></div>
<div id="modal" class="modal"><div class="modal-box">
<h2>Weka Bidhaa Mpya</h2>
<div class="upload-box" onclick="document.getElementById('f_file').click()"><img id="preview"><span id="uploadText">Bonyeza Kuchagua Picha Yenyewe</span><input id="f_file" type="file" accept="image/*" style="display:none" onchange="previewFile(this)"></div>
<input id="f_name" placeholder="Jina la bidhaa - mf: Suruali">
<input id="f_price" type="number" placeholder="Bei - mf: 15000">
<select id="f_cat"><option value="">Chagua Kundi</option><option>Nguo</option><option>Simu</option><option>Nyumbani</option><option>Chakula</option><option>Urembo</option></select>
<input id="f_vendor" placeholder="Jina la muuzaji">
<input id="f_phone" placeholder="Namba ya WhatsApp - mf: 0702379441">
<select id="f_location"><option>Nyegezi</option><option>Rock City</option><option>Igoma</option><option>Nyakato</option><option>Mkolani</option><option>Buhongwa</option><option>Nyamagana</option><option>Ilemela</option><option>Kiseke</option><option>Pasiansi</option><option>Kirumba</option><option>Isamilo</option></select>
<input id="f_area" placeholder="Mtaa / Eneo - mf: Karibu na Sokoni">
<button id="addBtn" class="btn-black" onclick="addProduct()">ONGEZA LIVE</button>
<button class="btn-grey" onclick="closeModal()">Funga</button>
</div></div>
<script>
const SUPABASE_URL = "https://exwdildhebdrweqpdjkb.supabase.co";
const SUPABASE_KEY = "sb_publishable_rsV-RqT04ZH-HzbJNpqMfw_5uKsyKUB";
let supabaseClient = null;
try{ supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY); }catch(e){ console.log(e); }
const CATS = ["Zote","Nguo","Simu","Nyumbani","Chakula","Urembo"];
let activeCat="Zote", activeLocation="Zote", products=[], selectedFile=null, isAdmin=false;
function renderCats(){ document.getElementById('cats').innerHTML = CATS.map(c=>'<div class="cat '+(c===activeCat?'active':'')+'" onclick="setCat(\''+c+'\')">'+c+'</div>').join(''); }
function setCat(c){ activeCat=c; renderCats(); render(); }
function setLocationFilter(loc){ activeLocation=loc; document.getElementById('locInfo').innerText = loc==="Zote" ? 'Inaonyesha bidhaa za Mwanza Yote' : 'Inaonyesha bidhaa zinazopatikana '+loc+' - Mwanza tu'; render(); }
function useMyLocation(){ if(!navigator.geolocation) return alert('Simu haiungi GPS'); document.getElementById('locInfo').innerText='Inatafuta ulipo Mwanza...'; navigator.geolocation.getCurrentPosition(function(pos){ var lat=pos.coords.latitude, lng=pos.coords.longitude; var areas=[{name:"Nyegezi", la:-2.498, lo:32.926},{name:"Rock City", la:-2.518, lo:32.901},{name:"Igoma", la:-2.530, lo:32.890},{name:"Nyakato", la:-2.520, lo:32.950},{name:"Mkolani", la:-2.510, lo:32.930},{name:"Buhongwa", la:-2.480, lo:32.880},{name:"Nyamagana", la:-2.516, lo:32.900},{name:"Ilemela", la:-2.540, lo:32.920},{name:"Kiseke", la:-2.560, lo:32.940},{name:"Pasiansi", la:-2.500, lo:32.910},{name:"Kirumba", la:-2.520, lo:32.910},{name:"Isamilo", la:-2.530, lo:32.920}]; var best="Nyegezi", bestD=999; areas.forEach(function(a){ var d=Math.hypot(lat-a.la, lng-a.lo); if(d<bestD){ bestD=d; best=a.name; } }); document.getElementById('locFilter').value=best; setLocationFilter(best); alert('Uko karibu na '+best); }, function(){ alert('Ruhusu Location kwenye simu'); }); }
function getMapLink(p){ if(p.latitude && p.longitude) return 'https://www.google.com/maps/search/?api=1&query='+p.latitude+','+p.longitude; return 'https://www.google.com/maps/search/'+encodeURIComponent((p.location||'Nyegezi')+' '+(p.area||'')+' Mwanza'); }
function esc(t){ return String(t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
async function loadProducts(){ if(supabaseClient){ try{ var res = await supabaseClient.from('bidhaa').select('*').order('created_at',{ascending:false}); if(!res.error && res.data){ products=res.data; render(); return; } console.log(res.error); }catch(e){ console.log(e); } } products=[]; render(); }
function render(){ var s=document.getElementById('search').value.toLowerCase(); var f=products.filter(function(p){ var loc=(p.location||'Nyegezi'); var area=(p.area||''); var ms=(p.name+' '+p.vendor+' '+loc+' '+area).toLowerCase().includes(s); var mc= activeCat==="Zote" || p.category===activeCat; var ml= activeLocation==="Zote" || loc===activeLocation; return ms && mc && ml; }); if(f.length===0){ document.getElementById('grid').innerHTML='<div class="empty-box"><div style="font-size:40px">Mahali</div><b>Hakuna bidhaa zinazopatikana '+esc(activeLocation)+'</b><br><button onclick="document.getElementById(\'locFilter\').value=\'Zote\';setLocationFilter(\'Zote\')" style="background:#000;color:#fff;border:none;padding:10px 20px;border-radius:100px;font-weight:900;margin-top:12px">ONA MWANZA YOTE</button></div>'; return; } document.getElementById('grid').innerHTML=f.map(function(p){ return '<div class="card"><div class="loc-badge">Mahali: '+esc(p.location||'Nyegezi')+'</div><img src="'+esc(p.image||p.picha_url)+'" onerror="this.src=\'https://via.placeholder.com/300\'"><div class="info"><div class="title">'+esc(p.name)+'</div><div class="price">TZS '+Number(p.price).toLocaleString()+'</div><div class="meta"><span>'+esc(p.vendor||'Admin')+'</span></div><div class="loc-box"><b>INAPATIKANA HAPA:</b><div>'+esc(p.location||'Nyegezi')+(p.area?' - '+esc(p.area):'')+'</div><small>Mwanza, Tanzania</small></div><a class="btn-map" href="'+getMapLink(p)+'" target="_blank">ONA RAMANI - CHEKI MAHALI</a><a href="https://wa.me/'+esc(p.phone)+'?text='+encodeURIComponent('Naulizia '+p.name+' - Bei '+p.price+' - Inapatikana wapi? Nimeona ipo: '+(p.location||'Nyegezi')+' '+(p.area||''))+'" style="text-decoration:none"><button class="btn">NUNUA WHATSAPP</button></a>'+(isAdmin ? '<button class="btn-del" onclick="deleteProduct('+p.id+')">FUTA BIDHAA HII (ADMIN)</button>' : '')+'</div></div>'; }).join(''); }
function previewFile(el){ selectedFile=el.files[0]; if(selectedFile){ var r=new FileReader(); r.onload=function(e){document.getElementById('preview').src=e.target.result;document.getElementById('preview').style.display='block';document.getElementById('uploadText').style.display='none';}; r.readAsDataURL(selectedFile); } }
function resetAddForm(){ selectedFile=null; document.getElementById('f_file').value=''; document.getElementById('f_name').value=''; document.getElementById('f_price').value=''; document.getElementById('f_cat').value=''; document.getElementById('f_area').value=''; document.getElementById('f_vendor').value=''; document.getElementById('f_phone').value=''; document.getElementById('preview').style.display='none'; document.getElementById('preview').src=''; document.getElementById('uploadText').style.display='block'; }
function openPinModal(){ document.getElementById('pinModal').classList.add('show'); }
function closePinModal(){ document.getElementById('pinModal').classList.remove('show'); }
function checkPin(){ var pin=document.getElementById('adminPin').value.trim(); if(pin==='0702'){ isAdmin=true; document.getElementById('fabBtn').style.display='flex'; document.getElementById('adminBtn').innerText='ADMIN ✓'; document.getElementById('adminPin').value=''; closePinModal(); render(); alert('Karibu Admin!'); } else { alert('Namba sio sahihi!'); } }
function openModal(){ if(!isAdmin) return alert('Ingia kama Admin kwanza!'); document.getElementById('modal').classList.add('show'); }
function closeModal(){ document.getElementById('modal').classList.remove('show'); }
async function addProduct(){
  if(!isAdmin) return alert('Admin tu anaweza kuweka!');
  var n=document.getElementById('f_name').value.trim();
  var p=document.getElementById('f_price').value;
  var cat=document.getElementById('f_cat').value;
  var v=document.getElementById('f_vendor').value.trim()||'Admin';
  var ph=document.getElementById('f_phone').value.trim()||'255702379441';
  var loc=document.getElementById('f_location').value;
  var area=document.getElementById('f_area').value.trim();
  if(!n||!p||!cat) return alert('Jaza jina, bei na uchague kundi!');
  if(!selectedFile) return alert('Chagua picha yenyewe kwanza!');
  if(ph){ ph=ph.replace(/^0/,'').replace(/^\+/,''); if(!ph.startsWith('255')) ph='255'+ph; }
  var btn=document.getElementById('addBtn'); btn.innerText='INAPANDISHA PICHA YENYEWE...'; btn.disabled=true;
  try{
    var fileName = Date.now() + '_' + selectedFile.name.replace(/[^a-zA-Z0-9.]/g,'_');
    var up = await supabaseClient.storage.from('product-images').upload(fileName, selectedFile);
    if(up.error) throw up.error;
    var pub = supabaseClient.storage.from('product-images').getPublicUrl(fileName);
    var imageUrl = pub.data.publicUrl;
    btn.innerText='INAHIFADHI BIDHAA...';
    var mapCoords={"Nyegezi":[-2.498,32.926],"Rock City":[-2.518,32.901],"Igoma":[-2.530,32.890],"Nyakato":[-2.520,32.950],"Mkolani":[-2.510,32.930],"Buhongwa":[-2.480,32.880],"Nyamagana":[-2.516,32.900],"Ilemela":[-2.540,32.920],"Kiseke":[-2.560,32.940],"Pasiansi":[-2.500,32.910],"Kirumba":[-2.520,32.910],"Isamilo":[-2.530,32.920]};
    var lat=mapCoords[loc]?mapCoords[loc][0]:null, lng=mapCoords[loc]?mapCoords[loc][1]:null;
    var res2 = await supabaseClient.from('bidhaa').insert([{name:n, price:parseInt(p), image:imageUrl, picha_url:imageUrl, category:cat, vendor:v, phone:ph, location:loc, area:area, latitude:lat, longitude:lng}]);
    if(res2.error) throw res2.error;
    alert('LIVE! Picha yenyewe imepanda');
    closeModal(); resetAddForm(); loadProducts();
  }catch(e){ alert('Error: '+e.message); console.log(e); }
  btn.innerText='ONGEZA LIVE'; btn.disabled=false;
}
async function deleteProduct(id){ if(!isAdmin) return alert('Hii ni kwa Admin tu!'); if(!confirm('Una uhakika unataka kuifuta bidhaa hii?')) return; try{ var res = await supabaseClient.from('bidhaa').delete().eq('id', id); if(res.error) throw res.error; products = products.filter(function(x){ return x.id!==id; }); render(); alert('Bidhaa imefutwa!'); }catch(e){ alert('Supabase imezuia: '+e.message); } }
renderCats(); loadProducts();
</script>
</body>
</html>
